name: CI Deep

on:
  push:
    branches: [main]
  schedule:
    - cron: "29 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep:
    runs-on: ${{ vars.PM_LOCAL_DEEP == 'on' && fromJSON('["self-hosted","pm-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      PM_TEST_DEPTH: full
      PM_TEST_TIME_SCALE: 3
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` and the first line that strips
        # TypeScript without a flag; 26 is what the fleet develops against.
        node-version: [22, 26]
        runtime: [npm, bun]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      - name: Setup Bun
        if: runner.environment == 'github-hosted'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Report Bun version
        run: bun --version

      - name: Install dependencies
        run: npm ci

      - name: Install project pm-github extension
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/pm package install npm:pm-github@2026.10.4 --project
          node -e 'if (require("./.agents/pm/extensions/pm-github/package.json").version !== "2026.10.4") process.exit(1)'
          managed_registry=".agents/pm/extensions/.managed-extensions.json"
          if git ls-files --error-unmatch "${managed_registry}" > /dev/null 2>&1; then
            git restore -- "${managed_registry}"
          else
            rm -f "${managed_registry}"
          fi

      - name: Verify tracked pm project health
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # `--strict-exit` is load-bearing: non-strict health may report findings while
          # still exiting successfully.
          ./node_modules/.bin/pm health --strict-exit --require-merge-drivers

      - name: Build and verify committed output is current
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch 'dist/' > /dev/null 2>&1; then
            echo "::error::dist/ is not tracked. This package is installed by copying the repository, so the build output has to be in git."
            exit 1
          fi
          rm -rf dist
          npm run build
          drift=$(git status --porcelain=v1 --untracked-files=all --ignored=matching -- 'dist/')
          if [ -n "$drift" ]; then
            echo "::error::Committed dist/ does not match a fresh build. Run 'npm run build' and commit the result."
            printf '%s\n' "$drift"
            exit 1
          fi
          echo "Committed dist/ matches a fresh build."

      - name: Full npm release gate
        if: matrix.runtime == 'npm'
        run: npm run release:check

      - name: Verify Bun can install the package graph
        id: bun_install
        # Each matrix leg certifies its own fresh dependency graph.
        if: matrix.runtime == 'bun'
        run: |
          rm -rf node_modules
          bun install --no-save

      - name: Full Bun release gate
        if: matrix.runtime == 'bun' && steps.bun_install.outcome == 'success'
        run: bun run release:check
